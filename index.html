<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Správa Školení</title>
    <style>
        body { font-family: sans-serif; margin: 20px; line-height: 1.6; }
        select { padding: 8px; margin-bottom: 20px; font-size: 16px; }
        .section { margin-bottom: 30px; }
        h2 { border-bottom: 2px solid #333; padding-bottom: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f4f4f4; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .info-panel { background: #f0f7ff; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        .empty-date { color: #999; font-style: italic; }
    </style>
</head>
<body>

    <h1>Přehled Školení</h1>

    <label for="kod-select">Vyberte kód školení:</label>
    <select id="kod-select">
        <option value="">-- Vyberte kód --</option>
    </select>

    <div class="info-panel" id="info-panel" style="display: none;">
        <h2 id="info-nazev"></h2>
        <p><strong>Platnost:</strong> <span id="info-platnost"></span> měsíců</p>
        <p><strong>Povinné pro:</strong> <span id="info-povinne"></span></p>
        <p id="info-poznamka"></p>
    </div>

    <div class="section">
        <h2>Termíny školení</h2>
        <table id="terminy-table">
            <thead>
                <tr>
                    <th>Datum</th>
                    <th>Čas</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="section">
        <h2>Seznam zaměstnanců</h2>
        <table id="employees-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Jméno a Příjmení</th>
                    <th>Útvar</th>
                    <th>Pozice</th>
                    <th>E-mail</th>
                    <th>Stav</th>
                    <th>Platnost do</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        // Global lookup objects
        let poziceMap = {};
        let utvarMap = {};

        // Run setup on page load
        document.addEventListener('DOMContentLoaded', async () => {
            await loadLookups();
            await loadKody();

            document.getElementById('kod-select').addEventListener('change', (e) => {
                if (e.target.value) {
                    loadTrainingDetails(e.target.value);
                } else {
                    resetUI();
                }
            });
        });

        // Load reference files and build key-value pairs
        async function loadLookups() {
            try {
                const [poziceRes, utvarRes] = await Promise.all([
                    fetch('data/pozice.json').then(r => r.json()).catch(() => []),
                    fetch('data/utvar.json').then(r => r.json()).catch(() => [])
                ]);

                // Convert arrays into maps for O(1) performance lookup
                poziceRes.forEach(item => poziceMap[item.id] = item.nazev);
                utvarRes.forEach(item => utvarMap[item.id] = item.nazev);
            } catch (err) {
                console.error("Chyba při načítání číselníků:", err);
            }
        }

        // Populate dropdown options
        async function loadKody() {
            try {
                const response = await fetch('data/kody_skoleni.json');
                const kody = await response.json();
                const select = document.getElementById('kod-select');

                kody.forEach(kod => {
                    const opt = document.createElement('option');
                    opt.value = kod;
                    opt.textContent = kod;
                    select.appendChild(opt);
                });
            } catch (err) {
                console.error("Chyba při načítání kódů školení:", err);
            }
        }

        // Fetch individual file and parse content
        async function loadTrainingDetails(kod) {
            try {
                const response = await fetch(`data/skoleni/${kod}.json`);
                const data = await response.json();

                renderInfo(data.training_info);
                renderTerminy(data.training_info.terminy || []);
                renderEmployees(data.employees || []);
            } catch (err) {
                console.error(`Chyba při načítání detailu školení ${kod}:`, err);
            }
        }

        function renderInfo(info) {
            document.getElementById('info-panel').style.display = 'block';
            document.getElementById('info-nazev').textContent = info.nazev;
            document.getElementById('info-platnost').textContent = info.platnost_mesicu;
            document.getElementById('info-povinne').textContent = info.povinne_pro;
            document.getElementById('info-poznamka').textContent = info.poznamka ? `Poznámka: ${info.poznamka}` : '';
        }

        function renderTerminy(terminy) {
            const tbody = document.querySelector('#terminy-table tbody');
            tbody.innerHTML = '';

            terminy.forEach(t => {
                const row = `<tr>
                    <td>${t.datum}</td>
                    <td>${t.cas}</td>
                </tr>`;
                tbody.insertAdjacentHTML('beforeend', row);
            });
        }

        function renderEmployees(employees) {
            const tbody = document.querySelector('#employees-table tbody');
            tbody.innerHTML = '';

            // Sort logic: Empty dates first, then descending chronological order
            employees.sort((a, b) => {
                if (!a.platnost_do && !b.platnost_do) return 0;
                if (!a.platnost_do) return -1;
                if (!b.platnost_do) return 1;
                return -b.platnost_do.localeCompare(a.platnost_do);
            });

            employees.forEach(e => {
                // Map the ID values to structural text strings (fallback to numerical ID if not found)
                const nazevPozice = poziceMap[e.pozice] || `Pozice ID ${e.pozice}`;
                const nazevUtvar = utvarMap[e.utvar] || `Útvar ID ${e.utvar}`;

                const platnostZobrazeni = e.platnost_do
                    ? e.platnost_do
                    : '<span class="empty-date">Nenastaveno</span>';

                const row = `<tr>
                    <td>${e.id_zamestnance}</td>
                    <td>${e.prijmeni} ${e.jmeno}</td>
                    <td>${nazevUtvar}</td>
                    <td>${nazevPozice}</td>
                    <td>${e.email}</td>
                    <td>${e.stav}</td>
                    <td>${platnostZobrazeni}</td>
                </tr>`;
                tbody.insertAdjacentHTML('beforeend', row);
            });
        }

        function resetUI() {
            document.getElementById('info-panel').style.display = 'none';
            document.querySelector('#terminy-table tbody').innerHTML = '';
            document.querySelector('#employees-table tbody').innerHTML = '';
        }
    </script>
</body>
</html>
